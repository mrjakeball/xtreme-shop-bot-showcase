    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#E2E8F0"/><stop offset="1" stop-color="#64748B"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#30363d" opacity=".34"/></pattern>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#grid)"/>
  <g fill="none" stroke="url(#accent)" stroke-width="2" opacity=".72">
