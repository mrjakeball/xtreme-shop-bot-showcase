  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="54" y="52" fill="#8B949E" font-size="15" letter-spacing="3">PROJECT DOSSIER · TELEGRAM / AUTOMATION</text>
    <text x="54" y="126" fill="#F0F6FC" font-size="46" font-weight="700" letter-spacing="1">X-TREME SHOP BOT</text>
